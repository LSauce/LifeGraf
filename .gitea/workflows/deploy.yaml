name: Java Build and Deploy
run-name: Build and Deploy lifegraf (Wrapper Mode)
on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. 使用 Maven Wrapper 打包
      - name: Build with Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. 上传 JAR 包到服务器
      - name: Copy file via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "target/lifegraf-*.jar"
          # ================= 修改点 1 =================
          # 这里直接使用 Secret 中的完整路径 (如 /Users/kiroh/SelfHost/lifegraf)
          target: ${{ secrets.APP_PATH }}
          # ===========================================
          strip_components: 1

      # 5. SSH 远程重启服务
      - name: Restart Application via SSH
        uses: appleboy/ssh-action@master
        # ================= 修改点 2 =================
        # 定义环境变量，从 Secrets 获取
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
          JAVA_HOME: ${{ secrets.JAVA_HOME }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          # 将环境变量传递给远程脚本
          envs: APP_PATH,JAVA_HOME
          script_stop: true
          script: |
            # ================= 配置 =================
            APP_NAME="lifegraf"
            LOG_FILE="app.log"
            # APP_PATH 和 JAVA_HOME 现在由 envs 自动注入，无需在此定义
            # =======================================

            echo "====== [1/5] 准备环境 ======"
            echo "部署路径: $APP_PATH"
            # 确保目录存在
            mkdir -p $APP_PATH
            cd $APP_PATH

            echo "====== [2/5] 查找最新版本 ======"
            JAR_NAME=$(ls -t *.jar | head -n 1)
            
            if [ -z "$JAR_NAME" ]; then
              echo "Error: 未找到 JAR 包！"
              exit 1
            fi
            echo "准备部署: $JAR_NAME"

            echo "====== [3/5] 停止旧进程 ======"
            PID=$(ps -ef | grep "$APP_NAME.*jar" | grep -v "grep" | awk '{print $2}')
            if [ -n "$PID" ]; then
              echo "Kill PID: $PID"
              kill $PID
              sleep 10
            else
              echo "无旧进程运行。"
            fi

            echo "====== [4/5] 清理历史版本 ======"
            ls -t *.jar | tail -n +2 | xargs -I {} rm {} 2>/dev/null || true

            echo "====== [5/5] 启动服务 ======"
            # 使用注入的 JAVA_HOME 变量启动
            nohup $JAVA_HOME/bin/java -jar $JAR_NAME > $LOG_FILE 2>&1 &
            
            echo "正在启动..."
            sleep 5
            
            tail -n 10 $LOG_FILE